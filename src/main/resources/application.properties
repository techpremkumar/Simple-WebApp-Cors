spring.application.name=simple-webapp-cors

# Database configuration - provide credentials through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spring_data_jpa_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Comma-separated list of trusted frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
